# opcviewer: Apache site for the project pages (installed by install.sh as
# /etc/apache2/sites-available/opcviewer.conf). The admin panel is not served by Apache;
# it runs on its own port ({{PORT}}) and should stay on your local network.
<VirtualHost *:80>
    DocumentRoot {{WWW}}

    <Directory {{WWW}}>
        Options -Indexes +SymLinksIfOwnerMatch
        # The .htaccess in {{WWW}} sets CORS, MIME types and cache headers, and turns off
        # folder listings; nothing else may be changed from there.
        AllowOverride FileInfo Options=Indexes
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # opcviewer reads this log for view counts and load timings (combined format).
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
